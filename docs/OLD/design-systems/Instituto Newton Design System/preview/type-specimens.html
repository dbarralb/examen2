<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  body { margin: 0; background: #182625; font-family: 'League Spartan', sans-serif; padding: 28px; display: flex; gap: 24px; }
  .col { flex: 1; }
  .label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #2A3F3C; margin-bottom: 8px; }
  .mono-block { background: #1E3230; border: 1px solid #2A3F3C; border-radius: 4px; padding: 12px 14px; font-family: 'Courier New', monospace; font-size: 13px; color: #D4FF8A; line-height: 1.8; }
  .mono-block .comment { color: #524D40; }
  .quote { font-size: 20px; font-weight: 300; font-style: italic; color: #E2D6AF; line-height: 1.5; border-left: 3px solid #C2F779; padding-left: 16px; }
  .quote .attr { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; color: #C2F779; margin-top: 8px; display: block; font-style: normal; }
</style>
<style>
@font-face {
  font-family: 'League Spartan';
  src: url('../fonts/LeagueSpartan-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
</style>
</head><body>
<div class="col">
  <div class="label">Mono / Technical</div>
  <div class="mono-block">
    <span class="comment">// CÓDIGO DE ACCESO</span><br>
    SECTOR_7 → A4-B9<br>
    LAT: 40.4168 N<br>
    LON: 003.7038 W<br>
    <span class="comment">// VERIFICANDO...</span>
  </div>
</div>
<div class="col">
  <div class="label">Lore / Quote Style</div>
  <div class="quote">
    "El Instituto Newton no presume de secretos. Pero tampoco los niega."
    <span class="attr">— Anne, Profesora de Química</span>
  </div>
</div>
</body></html>
