<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@font-face { font-family:'League Spartan'; src:url('../fonts/LeagueSpartan-VariableFont_wght.ttf') format('truetype'); font-weight:100 900; font-display:swap; }
body { margin:0; background:#0F1918; font-family:'League Spartan',sans-serif; padding:20px; display:flex; gap:12px; flex-wrap:wrap; }
.item { display:flex; align-items:center; gap:10px; background:#1E3230; border:1px solid #2A3F3C; border-radius:8px; padding:12px 16px; min-width:160px; }
.dot  { width:32px; height:32px; border-radius:50%; flex-shrink:0; }
.name { font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#E2D6AF; display:block; }
.hex  { font-size:11px; color:#524D40; font-family:'Courier New',monospace; }
.pill { display:inline-block; font-size:10px; font-weight:700; letter-spacing:0.06em; padding:2px 8px; border-radius:4px; margin-top:4px; }
</style></head><body>
<div class="item"><div class="dot" style="background:#C2F779;"></div><div><span class="name">Success</span><div class="hex">#C2F779</div><span class="pill" style="background:rgba(194,247,121,0.1);color:#C2F779;">bg 10%</span></div></div>
<div class="item"><div class="dot" style="background:#D97D0D;"></div><div><span class="name">Warning</span><div class="hex">#D97D0D</div><span class="pill" style="background:rgba(217,125,13,0.12);color:#D97D0D;">bg 12%</span></div></div>
<div class="item"><div class="dot" style="background:#A61212;"></div><div><span class="name">Danger</span><div class="hex">#A61212</div><span class="pill" style="background:rgba(166,18,18,0.12);color:#A61212;">bg 12%</span></div></div>
<div class="item"><div class="dot" style="background:#4A5B8C;"></div><div><span class="name">Info</span><div class="hex">#4A5B8C</div><span class="pill" style="background:rgba(74,91,140,0.15);color:#8A9DC0;">bg 15%</span></div></div>
</body></html>
