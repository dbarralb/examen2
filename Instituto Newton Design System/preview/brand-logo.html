<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@font-face {
  font-family: 'League Spartan';
  src: url('../fonts/LeagueSpartan-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900; font-display: swap;
}
body { margin: 0; background: #0F1918; font-family: 'League Spartan', sans-serif; padding: 24px; display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.vlabel { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #2A3F3C; margin-bottom: 2px; }
.on-navy  { background: #182625; padding: 16px 20px; }
.on-dark  { background: #0F1918; padding: 16px 20px; }
.on-cream { background: #E2D6AF; padding: 16px 20px; }
</style>
</head><body>
<div class="col">
  <div class="vlabel">Logo oficial</div>
  <div class="on-dark"><img src="../assets/logo.png" alt="Instituto Newton" style="height:120px;width:auto;display:block;"></div>
</div>
<div class="col">
  <div class="vlabel">Sobre navy</div>
  <div class="on-navy"><img src="../assets/logo.png" alt="Instituto Newton" style="height:80px;width:auto;display:block;"></div>
  <div class="vlabel">Sobre crema</div>
  <div class="on-cream"><img src="../assets/logo.png" alt="Instituto Newton" style="height:80px;width:auto;display:block;"></div>
  <div class="vlabel">Tamaño mínimo</div>
  <div class="on-dark"><img src="../assets/logo.png" alt="Instituto Newton" style="height:40px;width:auto;display:block;"></div>
</div>
</body></html>
