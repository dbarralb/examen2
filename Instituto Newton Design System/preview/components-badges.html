<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  body { margin: 0; background: #182625; font-family: 'League Spartan', sans-serif; padding: 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .section { display: flex; flex-direction: column; gap: 8px; margin-right: 16px; }
  .slabel { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #2A3F3C; margin-bottom: 2px; }
  .pill { border-radius: 9999px; }
</style>
<style>
@font-face {
  font-family: 'League Spartan';
  src: url('../fonts/LeagueSpartan-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
</style>
</head><body>
<div class="section">
  <div class="slabel">Status</div>
  <span class="badge" style="background:rgba(194,247,121,0.12);color:#C2F779;"><div class="dot" style="background:#C2F779;"></div>En Curso</span>
  <span class="badge" style="background:rgba(194,247,121,0.12);color:#C2F779;"><div class="dot" style="background:#C2F779;"></div>Completado</span>
  <span class="badge" style="background:rgba(166,18,18,0.12);color:#A61212;"><div class="dot" style="background:#A61212;"></div>Fallido</span>
  <span class="badge" style="background:rgba(217,125,13,0.12);color:#D97D0D;"><div class="dot" style="background:#D97D0D;"></div>Pendiente</span>
  <span class="badge" style="background:rgba(255,255,255,0.05);color:#7A7363;"><div class="dot" style="background:#7A7363;"></div>Bloqueado</span>
</div>
<div class="section">
  <div class="slabel">Level / Tier</div>
  <span class="badge pill" style="background:#D97D0D;color:#182625;">★ Élite</span>
  <span class="badge pill" style="background:#C2F779;color:#fff;">Nivel A</span>
  <span class="badge pill" style="background:#1E3230;border:1px solid #2A3F3C;color:#E2D6AF;">Nivel B</span>
</div>
<div class="section">
  <div class="slabel">Room Tags</div>
  <span class="badge" style="background:rgba(26,95,168,0.3);color:#C8BC95;">Laboratorio</span>
  <span class="badge" style="background:rgba(26,95,168,0.3);color:#C8BC95;">Biblioteca</span>
  <span class="badge" style="background:rgba(26,95,168,0.3);color:#C8BC95;">Dirección</span>
  <span class="badge" style="background:rgba(26,95,168,0.3);color:#C8BC95;">Enfermería</span>
</div>
</body></html>
