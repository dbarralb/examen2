<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #050F1A; font-family: 'League Spartan', sans-serif; padding: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .swatch { width: 110px; }
  .block { height: 72px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); }
  .name { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #8FA8C0; margin-top: 6px; }
  .hex  { font-size: 12px; font-weight: 400; color: #5A7A99; font-family: 'Courier New', monospace; }
</style>
<style>
@font-face {
  font-family: 'League Spartan';
  src: url('../fonts/LeagueSpartan-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
</style>
</head><body>
<div class="swatch"><div class="block" style="background:#013E70;"></div><div class="name">Navy</div><div class="hex">#013E70</div></div>
<div class="swatch"><div class="block" style="background:#012E55;"></div><div class="name">Navy Deep</div><div class="hex">#012E55</div></div>
<div class="swatch"><div class="block" style="background:#050F1A;"></div><div class="name">Navy Dark</div><div class="hex">#050F1A</div></div>
<div class="swatch"><div class="block" style="background:#0276D6;"></div><div class="name">Blue</div><div class="hex">#0276D6</div></div>
<div class="swatch"><div class="block" style="background:#1A8FEF;"></div><div class="name">Blue Light</div><div class="hex">#1A8FEF</div></div>
<div class="swatch"><div class="block" style="background:#1A5FA8;"></div><div class="name">Blue Mid</div><div class="hex">#1A5FA8</div></div>
<div class="swatch"><div class="block" style="background:#E2D6AF; border:1px solid #1A5FA8;"></div><div class="name">Cream</div><div class="hex">#E2D6AF</div></div>
<div class="swatch"><div class="block" style="background:#F5B800;"></div><div class="name">Gold</div><div class="hex">#F5B800</div></div>
</body></html>
