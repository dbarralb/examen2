<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@font-face { font-family:'League Spartan'; src:url('../fonts/LeagueSpartan-VariableFont_wght.ttf') format('truetype'); font-weight:100 900; font-display:swap; }
body { margin:0; background:#0F1918; font-family:'League Spartan',sans-serif; padding:24px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
.swatch { width:120px; }
.block { height:72px; border-radius:4px; border:1px solid rgba(255,255,255,0.06); }
.name { font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#7A7363; margin-top:6px; }
.hex  { font-size:11px; color:#524D40; font-family:'Courier New',monospace; }
.sep  { width:100%; height:1px; background:#1E3230; margin:8px 0; }
</style></head><body>

<div class="swatch"><div class="block" style="background:#182625;"></div><div class="name">Teal Deep</div><div class="hex">#182625</div></div>
<div class="swatch"><div class="block" style="background:#1E3230;"></div><div class="name">Teal Mid</div><div class="hex">#1E3230</div></div>
<div class="swatch"><div class="block" style="background:#0F1918;"></div><div class="name">Teal Dark</div><div class="hex">#0F1918</div></div>
<div class="swatch"><div class="block" style="background:#384173;"></div><div class="name">Slate</div><div class="hex">#384173</div></div>
<div class="swatch"><div class="block" style="background:#4A5B8C;"></div><div class="name">Slate Light</div><div class="hex">#4A5B8C</div></div>

<div class="sep"></div>

<div class="swatch"><div class="block" style="background:#495925;"></div><div class="name">Olive</div><div class="hex">#495925</div></div>
<div class="swatch"><div class="block" style="background:#403C27;"></div><div class="name">Brown</div><div class="hex">#403C27</div></div>
<div class="swatch"><div class="block" style="background:#402C2A;"></div><div class="name">Maroon</div><div class="hex">#402C2A</div></div>

<div class="sep"></div>

<div class="swatch"><div class="block" style="background:#C2F779; border:1px solid #2A3F3C;"></div><div class="name">Lime</div><div class="hex">#C2F779</div></div>
<div class="swatch"><div class="block" style="background:#D97D0D;"></div><div class="name">Amber</div><div class="hex">#D97D0D</div></div>
<div class="swatch"><div class="block" style="background:#A61212;"></div><div class="name">Crimson</div><div class="hex">#A61212</div></div>
<div class="swatch"><div class="block" style="background:#E2D6AF; border:1px solid #2A3F3C;"></div><div class="name">Cream</div><div class="hex">#E2D6AF</div></div>

</body></html>
