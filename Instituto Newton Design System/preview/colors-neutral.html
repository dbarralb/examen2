<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@font-face { font-family:'League Spartan'; src:url('../fonts/LeagueSpartan-VariableFont_wght.ttf') format('truetype'); font-weight:100 900; font-display:swap; }
body { margin:0; background:#0F1918; font-family:'League Spartan',sans-serif; padding:24px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
.swatch { width:100px; }
.block { height:60px; border-radius:4px; border:1px solid rgba(255,255,255,0.06); }
.name { font-size:10px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#7A7363; margin-top:6px; }
.hex  { font-size:10px; color:#524D40; font-family:'Courier New',monospace; }
</style></head><body>
<div class="swatch"><div class="block" style="background:#D4CEB8;"></div><div class="name">Gray 100</div><div class="hex">#D4CEB8</div></div>
<div class="swatch"><div class="block" style="background:#A89F88;"></div><div class="name">Gray 200</div><div class="hex">#A89F88</div></div>
<div class="swatch"><div class="block" style="background:#7A7363;"></div><div class="name">Gray 300</div><div class="hex">#7A7363</div></div>
<div class="swatch"><div class="block" style="background:#524D40;"></div><div class="name">Gray 400</div><div class="hex">#524D40</div></div>
<div class="swatch"><div class="block" style="background:#332E24;"></div><div class="name">Gray 500</div><div class="hex">#332E24</div></div>
<div class="swatch"><div class="block" style="background:#1E3230;"></div><div class="name">Teal Mid</div><div class="hex">#1E3230</div></div>
<div class="swatch"><div class="block" style="background:#0A1210;"></div><div class="name">Near Black</div><div class="hex">#0A1210</div></div>
</body></html>
