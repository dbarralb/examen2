<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #050F1A; font-family: 'League Spartan', sans-serif; padding: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .swatch { width: 90px; }
  .block { height: 60px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.06); }
  .name { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #8FA8C0; margin-top: 6px; }
  .hex  { font-size: 11px; color: #5A7A99; font-family: 'Courier New', monospace; }
</style>
<style>
@font-face {
  font-family: 'League Spartan';
  src: url('../fonts/LeagueSpartan-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
</style>
</head><body>
<div class="swatch"><div class="block" style="background:#E8EEF5;"></div><div class="name">Gray 100</div><div class="hex">#E8EEF5</div></div>
<div class="swatch"><div class="block" style="background:#C5D3E0;"></div><div class="name">Gray 200</div><div class="hex">#C5D3E0</div></div>
<div class="swatch"><div class="block" style="background:#8FA8C0;"></div><div class="name">Gray 300</div><div class="hex">#8FA8C0</div></div>
<div class="swatch"><div class="block" style="background:#5A7A99;"></div><div class="name">Gray 400</div><div class="hex">#5A7A99</div></div>
<div class="swatch"><div class="block" style="background:#3A5A78;"></div><div class="name">Gray 500</div><div class="hex">#3A5A78</div></div>
<div class="swatch"><div class="block" style="background:#1E3A55;"></div><div class="name">Gray 600</div><div class="hex">#1E3A55</div></div>
<div class="swatch"><div class="block" style="background:#102840;"></div><div class="name">Gray 700</div><div class="hex">#102840</div></div>
</body></html>
