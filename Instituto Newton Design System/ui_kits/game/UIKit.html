<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instituto Newton — UI Kit Completo</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
@font-face {
  font-family: 'League Spartan';
  src: url('../../fonts/LeagueSpartan-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900; font-display: swap;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #0A1210; }
body { font-family: 'League Spartan', 'Arial Narrow', sans-serif; color: #E2D6AF; min-height: 100vh; }
::-webkit-scrollbar { width: 6px; background: #0F1918; }
::-webkit-scrollbar-thumb { background: #2A3F3C; }

/* ── LAYOUT ── */
.page { display: flex; flex-direction: column; min-height: 100vh; }

/* ── TOP NAV ── */
.topnav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(15,25,24,0.96); border-bottom: 1px solid #2A3F3C;
  backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; height: 56px;
}
.topnav-logo { display: flex; align-items: center; gap: 12px; }
.topnav-logo img { height: 36px; width: auto; }
.topnav-title { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #7A7363; }
.topnav-tabs { display: flex; gap: 0; }
.topnav-tab {
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 0 18px; height: 56px; display: flex; align-items: center;
  color: #7A7363; border-bottom: 2px solid transparent; cursor: pointer;
  background: none; border-left: none; border-right: none; border-top: none;
  font-family: 'League Spartan', sans-serif;
  transition: color 150ms, border-color 150ms;
}
.topnav-tab:hover { color: #E2D6AF; }
.topnav-tab.active { color: #C2F779; border-bottom-color: #C2F779; }
.topnav-badge { font-size: 9px; background: rgba(194,247,121,0.12); color: #C2F779; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }

/* ── CONTENT ── */
.content { flex: 1; padding: 48px 32px; max-width: 1200px; margin: 0 auto; width: 100%; }
.section { margin-bottom: 64px; }
.section-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; padding-bottom: 12px; border-bottom: 1px solid #1E3230; }
.section-title { font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; color: #fff; }
.section-sub { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #524D40; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.flex-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.flex-col { display: flex; flex-direction: column; gap: 10px; }

/* ── TOKEN LABEL ── */
.tok-label { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #524D40; margin-bottom: 8px; }

/* ── COLOR SWATCHES ── */
.swatch-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { display: flex; flex-direction: column; gap: 4px; width: 80px; }
.swatch-block { height: 56px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.06); }
.swatch-name { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #7A7363; }
.swatch-hex  { font-size: 10px; color: #524D40; font-family: 'Courier New', monospace; }
.swatch-divider { width: 1px; background: #1E3230; margin: 0 4px; align-self: stretch; }

/* ── TYPE SAMPLES ── */
.type-row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid #1A2422; }
.type-meta { width: 130px; flex-shrink: 0; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #524D40; font-family: 'Courier New', monospace; }
.type-sample { color: #E2D6AF; }

/* ── COMPONENT BLOCK ── */
.comp-block { background: #182625; border: 1px solid #2A3F3C; border-radius: 8px; padding: 24px; }
.comp-block.dark { background: #0F1918; }
.comp-block.surface { background: #1E3230; }

/* ── BADGE STRIP ── */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; font-family: 'League Spartan', sans-serif; }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; }

/* ── BUTTON ── */
.btn { font-family: 'League Spartan', sans-serif; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; border: none; cursor: pointer; transition: all 150ms; display: inline-flex; align-items: center; gap: 8px; }
.btn-md { padding: 12px 24px; font-size: 13px; }
.btn-sm { padding: 8px 16px; font-size: 11px; }
.btn-lg { padding: 16px 32px; font-size: 15px; }
.btn-primary { background: #C2F779; color: #182625; border-radius: 0; }
.btn-primary:hover { background: #D4FF8A; }
.btn-secondary { background: transparent; color: #C2F779; border: 1px solid #C2F779; border-radius: 0; }
.btn-secondary:hover { background: rgba(194,247,121,0.08); }
.btn-ghost { background: transparent; color: #E2D6AF; border: 1px solid #2A3F3C; border-radius: 0; }
.btn-ghost:hover { border-color: #E2D6AF; }
.btn-amber { background: #D97D0D; color: #182625; border-radius: 0; }
.btn-amber:hover { background: #F08D1A; }
.btn-danger { background: #A61212; color: #fff; border-radius: 0; }
.btn-danger:hover { background: #C01515; }
.btn-disabled { background: #1E3230; color: #524D40; border-radius: 0; cursor: not-allowed; }
.btn-slate { background: #384173; color: #E2D6AF; border-radius: 0; border: none; }
.btn-slate:hover { background: #4A5B8C; }

/* ── INPUTS ── */
.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7A7363; }
.field input, .field select, .field textarea {
  font-family: 'League Spartan', sans-serif; font-size: 14px;
  background: #0F1918; border: 1px solid #2A3F3C; color: #E2D6AF;
  padding: 10px 14px; outline: none; width: 100%; border-radius: 0;
  transition: border-color 150ms;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: #C2F779; box-shadow: 0 0 0 2px rgba(194,247,121,0.12); }
.field input::placeholder, .field textarea::placeholder { color: #524D40; }
.field-error input { border-color: #A61212; }
.field-error .err { font-size: 11px; color: #A61212; font-weight: 600; }
.field-success input { border-color: #C2F779; }
.field-helper { font-size: 11px; color: #524D40; }

/* ── CARD ── */
.card { background: #1E3230; border: 1px solid #2A3F3C; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(10,16,15,0.5); }
.card.glow { border-color: #C2F779; box-shadow: 0 0 20px rgba(194,247,121,0.15); }
.card.amber { border-color: #D97D0D; box-shadow: 0 0 16px rgba(217,125,13,0.15); }
.card.slate { background: #2B3159; border-color: #384173; }
.card-title { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; margin-bottom: 8px; }
.card-body  { font-size: 13px; color: #A89F88; line-height: 1.6; }
.card-num   { font-size: 36px; font-weight: 900; color: #C2F779; line-height: 1; margin-bottom: 6px; }

/* ── PROGRESS ── */
.progress-wrap { display: flex; flex-direction: column; gap: 6px; }
.progress-top { display: flex; justify-content: space-between; }
.progress-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #7A7363; }
.progress-val   { font-size: 10px; color: #524D40; font-family: 'Courier New', monospace; }
.progress-track { background: #0F1918; height: 6px; border-radius: 0; overflow: hidden; }
.progress-fill  { height: 100%; transition: width 300ms; }

/* ── TIMER ── */
.timer { font-family: 'Courier New', monospace; font-size: 36px; font-weight: 700; letter-spacing: 0.05em; }
.timer.ok     { color: #C2F779; text-shadow: 0 0 12px rgba(194,247,121,0.3); }
.timer.urgent { color: #A61212; text-shadow: 0 0 12px rgba(166,18,18,0.4); animation: pulse 1s step-end infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── MODAL ── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,25,24,0.88); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: #1E3230; border: 1px solid #C2F779; border-radius: 8px; padding: 32px; width: 460px; box-shadow: 0 0 24px rgba(194,247,121,0.15); }
.modal-title { font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; color: #fff; margin-bottom: 16px; }

/* ── TOAST ── */
.toast { display: flex; align-items: flex-start; gap: 12px; background: #1E3230; border-radius: 6px; padding: 14px 16px; box-shadow: 0 4px 16px rgba(10,16,15,0.6); min-width: 280px; }
.toast-icon { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; margin-top: 1px; }
.toast-title { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 2px; }
.toast-body  { font-size: 12px; color: #7A7363; line-height: 1.4; }

/* ── CODE ── */
.code-block { font-family: 'Courier New', monospace; font-size: 13px; background: #0A1210; border: 1px solid #2A3F3C; border-radius: 4px; padding: 14px 16px; color: #C2F779; line-height: 1.8; }
.code-comment { color: #2A3F3C; }
.code-key { color: #D97D0D; }

/* ── DIVIDER ── */
.ndivider { border: none; border-top: 1px solid #2A3F3C; margin: 12px 0; }

/* ── TOOLTIP mock ── */
.tooltip-wrap { position: relative; display: inline-flex; }
.tooltip-box {
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: #1E3230; border: 1px solid #2A3F3C; border-radius: 4px;
  padding: 6px 10px; white-space: nowrap;
  font-size: 11px; font-weight: 600; color: #E2D6AF;
  pointer-events: none;
}
.tooltip-box::after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:#2A3F3C; }

/* ── KEYPAD ── */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 180px; }
.key { background: #1E3230; border: 1px solid #2A3F3C; border-radius: 4px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #E2D6AF; cursor: pointer; transition: all 100ms; font-family: 'Courier New', monospace; }
.key:hover { background: #2A3F3C; border-color: #C2F779; color: #C2F779; }
.key.wide { grid-column: span 2; }
.key.action { background: #C2F779; color: #182625; border-color: #C2F779; }

/* ── HUD STRIP ── */
.hud-strip { background: rgba(15,25,24,0.97); border: 1px solid #2A3F3C; border-radius: 6px; padding: 12px 20px; display: flex; align-items: center; gap: 24px; }
.hud-item { display: flex; flex-direction: column; gap: 2px; }
.hud-key  { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #524D40; }
.hud-val  { font-size: 16px; font-weight: 800; color: #fff; }
.hud-sep  { width: 1px; height: 32px; background: #2A3F3C; }

/* ── RADIO / CHECKBOX ── */
.check-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.check-box { width: 18px; height: 18px; border: 1px solid #2A3F3C; border-radius: 0; background: #0F1918; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.check-box.checked { background: #C2F779; border-color: #C2F779; }
.check-box.checked::after { content: ''; width: 10px; height: 6px; border-bottom: 2px solid #182625; border-left: 2px solid #182625; transform: rotate(-45deg) translateY(-2px); display: block; }
.radio-box { width: 18px; height: 18px; border: 1px solid #2A3F3C; border-radius: 50%; background: #0F1918; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.radio-box.checked { border-color: #C2F779; }
.radio-box.checked::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #C2F779; display: block; }
.check-label { font-size: 13px; color: #C8BC95; }

/* ── INVENTORY SLOT ── */
.inv-grid { display: grid; grid-template-columns: repeat(5, 52px); gap: 6px; }
.inv-slot { width: 52px; height: 52px; background: #0F1918; border: 1px solid #2A3F3C; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: border-color 150ms; }
.inv-slot:hover { border-color: #C2F779; }
.inv-slot.active { border-color: #C2F779; box-shadow: 0 0 12px rgba(194,247,121,0.2); }
.inv-slot.empty { opacity: 0.3; }

/* ── NPC DIALOG ── */
.dialog-box { background: #182625; border: 1px solid #2A3F3C; border-radius: 8px; padding: 20px; }
.dialog-npc { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.dialog-avatar { width: 40px; height: 40px; border-radius: 50%; background: #384173; border: 2px solid #4A5B8C; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.dialog-name { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #C2F779; }
.dialog-role { font-size: 10px; color: #7A7363; letter-spacing: 0.05em; }
.dialog-text { font-size: 14px; color: #C8BC95; line-height: 1.7; font-style: italic; border-left: 2px solid #D97D0D; padding-left: 14px; }
.dialog-options { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.dialog-opt { background: #0F1918; border: 1px solid #2A3F3C; border-radius: 4px; padding: 10px 14px; font-size: 12px; color: #E2D6AF; cursor: pointer; transition: all 150ms; text-align: left; font-family: 'League Spartan', sans-serif; }
.dialog-opt:hover { border-color: #C2F779; color: #C2F779; background: rgba(194,247,121,0.05); }

/* ── MISSION STATUS ── */
.mission-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid #1A2422; }
.mission-num { font-size: 22px; font-weight: 900; line-height: 1; flex-shrink: 0; width: 32px; }
.mission-title { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.mission-desc  { font-size: 11px; color: #7A7363; line-height: 1.5; }

/* ── LOG ENTRY ── */
.log-entry { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid #1A2422; }
.log-time { font-size: 10px; font-family: 'Courier New', monospace; color: #524D40; flex-shrink: 0; margin-top: 2px; width: 44px; }
.log-msg  { font-size: 12px; color: #7A7363; line-height: 1.4; }
.log-msg.highlight { color: #C2F779; }
</style>
</head>
<body>
<div class="page" id="root"></div>

<script type="text/babel">
const { useState } = React;

const TABS = ['Colores', 'Tipografía', 'Botones', 'Formularios', 'Tarjetas', 'Feedback', 'Juego'];

function Swatch({ color, name, hex, light }) {
  return (
    <div className="swatch">
      <div className="swatch-block" style={{ background: color, border: light ? '1px solid #2A3F3C' : undefined }}></div>
      <div className="swatch-name">{name}</div>
      <div className="swatch-hex">{hex}</div>
    </div>
  );
}

function SectionHeader({ title, sub }) {
  return (
    <div className="section-header">
      <div className="section-title">{title}</div>
      {sub && <div className="section-sub">{sub}</div>}
    </div>
  );
}

function Badge({ color, bg, dot, children }) {
  return (
    <span className="badge" style={{ background: bg, color }}>
      {dot && <span className="badge-dot" style={{ background: color }}></span>}
      {children}
    </span>
  );
}

function CheckBox({ checked, label }) {
  const [on, setOn] = useState(checked);
  return (
    <div className="check-row" onClick={() => setOn(!on)}>
      <div className={`check-box ${on ? 'checked' : ''}`}></div>
      <span className="check-label">{label}</span>
    </div>
  );
}

function RadioBox({ checked, label }) {
  const [on, setOn] = useState(checked);
  return (
    <div className="check-row" onClick={() => setOn(!on)}>
      <div className={`radio-box ${on ? 'checked' : ''}`}></div>
      <span className="check-label">{label}</span>
    </div>
  );
}

function ProgressBar({ label, value, color = '#C2F779' }) {
  return (
    <div className="progress-wrap">
      <div className="progress-top">
        <span className="progress-label">{label}</span>
        <span className="progress-val">{value}%</span>
      </div>
      <div className="progress-track">
        <div className="progress-fill" style={{ width: `${value}%`, background: color }}></div>
      </div>
    </div>
  );
}

function ColoresTab() {
  return (
    <>
      <div className="section">
        <SectionHeader title="Fondos Oscuros" sub="Dark backgrounds" />
        <div className="swatch-grid">
          <Swatch color="#182625" name="Teal Deep" hex="#182625" />
          <Swatch color="#1E3230" name="Teal Mid" hex="#1E3230" />
          <Swatch color="#0F1918" name="Teal Dark" hex="#0F1918" />
          <Swatch color="#0A1210" name="Near Black" hex="#0A1210" />
          <div className="swatch-divider"></div>
          <Swatch color="#384173" name="Slate" hex="#384173" />
          <Swatch color="#4A5B8C" name="Slate Light" hex="#4A5B8C" />
          <Swatch color="#2B3159" name="Slate Dim" hex="#2B3159" />
          <div className="swatch-divider"></div>
          <Swatch color="#495925" name="Olive" hex="#495925" />
          <Swatch color="#403C27" name="Brown" hex="#403C27" />
          <Swatch color="#402C2A" name="Maroon" hex="#402C2A" />
        </div>
      </div>

      <div className="section">
        <SectionHeader title="Acentos Primarios" sub="Interactive & accent" />
        <div className="swatch-grid">
          <Swatch color="#C2F779" name="Lime" hex="#C2F779" light />
          <Swatch color="#D4FF8A" name="Lime Hover" hex="#D4FF8A" light />
          <Swatch color="#A8E055" name="Lime Press" hex="#A8E055" light />
          <div className="swatch-divider"></div>
          <Swatch color="#D97D0D" name="Amber" hex="#D97D0D" />
          <Swatch color="#F08D1A" name="Amber Hover" hex="#F08D1A" />
          <div className="swatch-divider"></div>
          <Swatch color="#A61212" name="Crimson" hex="#A61212" />
          <Swatch color="#C01515" name="Crimson Hover" hex="#C01515" />
        </div>
      </div>

      <div className="section">
        <SectionHeader title="Texto & Neutrales" sub="Foreground & warm grays" />
        <div className="swatch-grid">
          <Swatch color="#E2D6AF" name="Cream" hex="#E2D6AF" light />
          <Swatch color="#C8BC95" name="Cream Dim" hex="#C8BC95" light />
          <Swatch color="#A89F88" name="Gray 200" hex="#A89F88" light />
          <Swatch color="#7A7363" name="Gray 300" hex="#7A7363" light />
          <Swatch color="#524D40" name="Gray 400" hex="#524D40" light />
          <Swatch color="#332E24" name="Gray 500" hex="#332E24" />
          <div className="swatch-divider"></div>
          <Swatch color="#2A3F3C" name="Border" hex="#2A3F3C" />
          <Swatch color="#FFFFFF" name="White" hex="#FFFFFF" light />
        </div>
      </div>

      <div className="section">
        <SectionHeader title="Semánticos" sub="Status colors" />
        <div className="swatch-grid">
          <Swatch color="#C2F779" name="Success" hex="#C2F779" light />
          <Swatch color="#D97D0D" name="Warning" hex="#D97D0D" />
          <Swatch color="#A61212" name="Danger" hex="#A61212" />
          <Swatch color="#4A5B8C" name="Info" hex="#4A5B8C" />
        </div>
      </div>
    </>
  );
}

function TipografiaTab() {
  return (
    <>
      <div className="section">
        <SectionHeader title="Escala Tipográfica" sub="League Spartan — 12 a 96px" />
        <div style={{ background: '#182625', border: '1px solid #2A3F3C', borderRadius: 8, padding: '24px 28px' }}>
          {[
            { label: '96px / 900', s: 96, w: 900, ls: '-0.02em', text: 'Aa', upper: true },
            { label: '64px / 900', s: 64, w: 900, ls: '-0.02em', text: 'Instituto', upper: true },
            { label: '48px / 700', s: 48, w: 700, ls: '-0.01em', text: 'Newton', upper: true },
            { label: '32px / 700', s: 32, w: 700, ls: '-0.01em', text: 'Misión Principal', upper: false },

            { time: '58:42', msg: 'Encontraste el archivo rojo en la sala 4.', hl: true },
            { time: '55:10', msg: 'Accediste al pasillo norte.' },
            { time: '51:33', msg: 'Anne te dio una pista sobre la maceta.' },
            { time: '48:02', msg: 'Tarjeta Nivel B obtenida en cocina.' },
            { time: '45:17', msg: 'Intentaste abrir la Sala 11. Acceso denegado.', err: true },
            { time: '42:50', msg: 'Llave Maestra #4 encontrada.' },
          ].map((e, i) => (
            <div className="log-entry" key={i}>
              <div className="log-time">{e.time}</div>
              <div className={`log-msg ${e.hl ? 'highlight' : ''}`} style={e.err ? { color: '#A61212' } : {}}>{e.msg}</div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

const TAB_COMPONENTS = {
  'Colores': ColoresTab,
  'Tipografía': TipografiaTab,
  'Botones': BotonesTab,
  'Formularios': FormulariosTab,
  'Tarjetas': TarjetasTab,
  'Feedback': FeedbackTab,
  'Juego': JuegoTab,
};

function App() {
  const [tab, setTab] = useState(() => localStorage.getItem('newton_kit_tab') || 'Colores');
  const go = t => { localStorage.setItem('newton_kit_tab', t); setTab(t); };
  const TabComp = TAB_COMPONENTS[tab] || ColoresTab;

  return (
    <div className="page">
      <nav className="topnav">
        <div className="topnav-logo">
          <img src="../../assets/logo.png" alt="Instituto Newton" />
          <span className="topnav-title">UI Kit</span>
        </div>
        <div className="topnav-tabs">
          {TABS.map(t => (
            <button key={t} className={`topnav-tab ${tab === t ? 'active' : ''}`} onClick={() => go(t)}>
              {t}
            </button>
          ))}
        </div>
        <div style={{ width: 180 }}></div>
      </nav>
      <div className="content">
        <TabComp />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
