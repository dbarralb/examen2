<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-void); padding: 24px 20px; display: flex; align-items: center; justify-content: center; }
  .logo-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .logo-main {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 0.12em;
    color: #ffffff;
    line-height: 1;
    position: relative;
    text-transform: uppercase;
  }
  .logo-main .accent { color: #00FF87; text-shadow: 0 0 16px rgba(0,255,135,0.6), 0 0 40px rgba(0,255,135,0.25); }
  .logo-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #6B7A96;
    text-transform: uppercase;
  }
  .logo-bar { width: 100%; height: 1px; background: linear-gradient(to right, transparent, #00FF87, transparent); opacity: 0.4; margin: 4px 0; }
  /* Glitch variant */
  .logo-glitch { position: relative; display: inline-block; }
  .logo-glitch::before {
    content: 'EL EXAMEN';
    position: absolute; inset: 0;
    color: #FF2D78; clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
    transform: translateX(-3px);
    opacity: 0.7;
  }
  .logo-glitch::after {
    content: 'EL EXAMEN';
    position: absolute; inset: 0;
    color: #00EAFF; clip-path: polygon(0 55%, 100% 55%, 100% 70%, 0 70%);
    transform: translateX(3px);
    opacity: 0.6;
  }
</style>
</head><body>
<div style="display:flex;gap:48px;align-items:center">
  <div class="logo-wrap">
    <div class="logo-main">El Examen<span class="accent">_2</span></div>
    <div class="logo-bar"></div>
    <div class="logo-sub">// terminal interface</div>
  </div>
  <div style="width:1px;height:64px;background:var(--border-dim)"></div>
  <div class="logo-wrap">
    <div class="logo-main logo-glitch">EL EXAMEN<span class="accent">_2</span></div>
    <div class="logo-sub" style="color:#FF2D78;opacity:0.7">// glitch variant</div>
  </div>
</div>
</body></html>
