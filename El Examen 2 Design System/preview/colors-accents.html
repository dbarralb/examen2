<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-void); padding: 20px 16px; font-family: var(--font-mono); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .accent { display: flex; flex-direction: column; gap: 4px; width: 78px; }
  .accent-name { font-size: 9px; color: var(--text-ghost); text-transform: uppercase; letter-spacing: 0.1em; }
  .chips { display: flex; flex-direction: column; gap: 3px; }
  .chip { height: 32px; border-radius: 1px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: rgba(0,0,0,0.6); font-weight: 700; letter-spacing: 0.05em; }
  .chip.dim { opacity: 0.55; }
  .chip.ultra { opacity: 0.75; }
  .chip-hex { font-size: 8px; color: var(--text-ghost); }
  .glow-demo { display: flex; gap: 12px; margin-top: 14px; align-items: center; }
  .glow-dot { width: 8px; height: 8px; border-radius: 50%; }
  .glow-label { font-size: 9px; color: var(--text-tertiary); letter-spacing: 0.08em; }
</style>
</head><body>
<div class="row">
  <div class="accent">
    <div class="accent-name">Green</div>
    <div class="chips">
      <div class="chip ultra" style="background:#AAFFDD">ULTRA</div>
      <div class="chip" style="background:#00FF87">PRIMARY</div>
      <div class="chip dim" style="background:#00CC6A">DIM</div>
      <div class="chip" style="background:rgba(0,255,135,0.16);border:1px solid #00FF87;color:#00FF87;">BG-HI</div>
    </div>
    <div class="chip-hex">#00FF87</div>
  </div>
  <div class="accent">
    <div class="accent-name">Magenta</div>
    <div class="chips">
      <div class="chip ultra" style="background:#FFAAC9">ULTRA</div>
      <div class="chip" style="background:#FF2D78">PRIMARY</div>
      <div class="chip dim" style="background:#CC2460">DIM</div>
      <div class="chip" style="background:rgba(255,45,120,0.16);border:1px solid #FF2D78;color:#FF2D78;">BG-HI</div>
    </div>
    <div class="chip-hex">#FF2D78</div>
  </div>
  <div class="accent">
    <div class="accent-name">Purple</div>
    <div class="chips">
      <div class="chip ultra" style="background:#D4AAFF;color:rgba(0,0,0,0.5)">ULTRA</div>
      <div class="chip" style="background:#9B00FF">PRIMARY</div>
      <div class="chip dim" style="background:#7A00CC">DIM</div>
      <div class="chip" style="background:rgba(155,0,255,0.16);border:1px solid #9B00FF;color:#9B00FF;">BG-HI</div>
    </div>
    <div class="chip-hex">#9B00FF</div>
  </div>
  <div class="accent">
    <div class="accent-name">Cyan</div>
    <div class="chips">
      <div class="chip" style="background:#00EAFF;color:rgba(0,0,0,0.6)">PRIMARY</div>
      <div class="chip dim" style="background:#00BBCC;color:rgba(0,0,0,0.6)">DIM</div>
      <div class="chip" style="background:rgba(0,234,255,0.16);border:1px solid #00EAFF;color:#00EAFF;">BG-HI</div>
    </div>
    <div class="chip-hex">#00EAFF</div>
  </div>
  <div class="accent">
    <div class="accent-name">Yellow</div>
    <div class="chips">
      <div class="chip" style="background:#FFEA00;color:rgba(0,0,0,0.6)">PRIMARY</div>
      <div class="chip dim" style="background:#CCBB00;color:rgba(0,0,0,0.6)">DIM</div>
      <div class="chip" style="background:rgba(255,234,0,0.16);border:1px solid #FFEA00;color:#FFEA00;">BG-HI</div>
    </div>
    <div class="chip-hex">#FFEA00</div>
  </div>
</div>
<div class="glow-demo">
  <div class="glow-dot" style="background:#00FF87;box-shadow:0 0 6px rgba(0,255,135,0.7)"></div><span class="glow-label">glow-sm</span>
  <div class="glow-dot" style="background:#00FF87;box-shadow:0 0 14px rgba(0,255,135,0.55),0 0 30px rgba(0,255,135,0.25)"></div><span class="glow-label">glow-md</span>
  <div class="glow-dot" style="background:#FF2D78;box-shadow:0 0 14px rgba(255,45,120,0.55),0 0 30px rgba(255,45,120,0.25)"></div><span class="glow-label">magenta</span>
  <div class="glow-dot" style="background:#9B00FF;box-shadow:0 0 14px rgba(155,0,255,0.55),0 0 30px rgba(155,0,255,0.25)"></div><span class="glow-label">purple</span>
  <div class="glow-dot" style="background:#00EAFF;box-shadow:0 0 14px rgba(0,234,255,0.55),0 0 30px rgba(0,234,255,0.25)"></div><span class="glow-label">cyan</span>
</div>
</body></html>
