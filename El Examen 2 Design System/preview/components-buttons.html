<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-void); padding: 20px 16px; font-family: var(--font-ui); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .section { font-size: 9px; color: var(--text-ghost); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; }
  
  /* Base button */
  .btn {
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 20px;
    cursor: pointer;
    border: none;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    transition: all 120ms linear;
    display: inline-flex; align-items: center; gap: 6px;
    position: relative; outline: none;
  }
  
  /* Primary — neon green */
  .btn-primary {
    background: var(--neon-green);
    color: #050810;
    box-shadow: 0 0 14px rgba(0,255,135,0.4);
  }
  .btn-primary:hover { background: #00FFB0; box-shadow: 0 0 20px rgba(0,255,135,0.7), 0 0 40px rgba(0,255,135,0.3); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); box-shadow: 0 0 8px rgba(0,255,135,0.5); }

  /* Secondary — outlined */
  .btn-secondary {
    background: transparent;
    color: var(--neon-green);
    border: 1px solid var(--neon-green);
    box-shadow: inset 0 0 0 0 rgba(0,255,135,0), 0 0 6px rgba(0,255,135,0.2);
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  }
  .btn-secondary:hover { background: rgba(0,255,135,0.1); box-shadow: 0 0 14px rgba(0,255,135,0.4); }

  /* Danger — magenta */
  .btn-danger {
    background: var(--neon-magenta);
    color: #ffffff;
    box-shadow: 0 0 14px rgba(255,45,120,0.4);
  }
  .btn-danger:hover { box-shadow: 0 0 20px rgba(255,45,120,0.7); transform: translateY(-1px); }

  /* Ghost */
  .btn-ghost {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-mid);
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  }
  .btn-ghost:hover { border-color: var(--border-bright); color: var(--text-primary); }

  /* Disabled */
  .btn-disabled {
    background: var(--bg-panel);
    color: var(--text-disabled);
    border: 1px solid var(--border-dim);
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    cursor: not-allowed;
    opacity: 0.5;
  }

  /* Icon btn */
  .btn-icon {
    width: 36px; height: 36px; padding: 0;
    background: transparent;
    color: var(--neon-cyan);
    border: 1px solid var(--neon-cyan);
    clip-path: polygon(8px 0%, 100% 0%, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0% 100%, 0% 8px);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px;
    box-shadow: 0 0 6px rgba(0,234,255,0.3);
  }
  .btn-icon:hover { box-shadow: 0 0 14px rgba(0,234,255,0.5); background: rgba(0,234,255,0.1); }

  .corner-tick { font-size: 9px; color: var(--text-ghost); }
</style>
</head><body>
<div class="section">Buttons</div>
<div class="row">
  <button class="btn btn-primary">▸ Execute</button>
  <button class="btn btn-secondary">▸ Run Module</button>
  <button class="btn btn-danger">✕ Terminate</button>
  <button class="btn btn-ghost">// Config</button>
  <button class="btn btn-disabled" disabled>Locked</button>
  <button class="btn btn-icon">◈</button>
</div>
</body></html>
