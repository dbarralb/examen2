<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-void); padding: 16px; overflow: hidden; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: baseline; gap: 12px; }
  .specimen { font-family: var(--font-display); text-transform: uppercase; color: var(--text-primary); letter-spacing: var(--tracking-display); line-height: 1; }
  .meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-ghost); white-space: nowrap; }
  .accent { color: var(--neon-green); text-shadow: 0 0 12px rgba(0,255,135,0.5); }
  .divider { height: 1px; background: var(--border-dim); margin: 4px 0; }
</style>
</head><body>
<div class="stack">
  <div class="row"><div class="specimen" style="font-size:56px">EXAMEN<span class="accent">_2</span></div><div class="meta">96px / Bebas Neue / display</div></div>
  <div class="divider"></div>
  <div class="row"><div class="specimen" style="font-size:40px">ACCESS DENIED</div><div class="meta">64px / h2</div></div>
  <div class="row"><div class="specimen" style="font-size:30px">System Override</div><div class="meta">48px / h3</div></div>
  <div class="row"><div class="specimen" style="font-size:22px">Initialize Protocol</div><div class="meta">32px / h4</div></div>
  <div class="row"><div class="specimen" style="font-size:16px">Module Integrity Check</div><div class="meta">24px / h5</div></div>
</div>
</body></html>
