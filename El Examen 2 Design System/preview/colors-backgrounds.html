<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-void); display: flex; align-items: center; padding: 16px; gap: 0; font-family: var(--font-mono); }
  .row { display: flex; gap: 6px; align-items: flex-end; }
  .swatch { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .chip { width: 64px; height: 40px; border: 1px solid rgba(255,255,255,0.07); }
  .chip.sm { height: 28px; width: 48px; }
  .lbl { font-size: 9px; color: var(--text-ghost); text-align: center; letter-spacing: 0.04em; line-height: 1.3; }
  .val { font-size: 8px; color: var(--text-disabled); text-align: center; }
  .divider { width: 1px; background: var(--border-dim); margin: 0 8px; align-self: stretch; }
  .section-label { font-size: 9px; color: var(--text-ghost); text-transform: uppercase; letter-spacing: 0.12em; writing-mode: vertical-rl; margin-right: 8px; }
</style>
</head><body>
<div class="row">
  <div class="section-label">BG</div>
  <div class="swatch"><div class="chip" style="background:#050810"></div><div class="lbl">void</div><div class="val">#050810</div></div>
  <div class="swatch"><div class="chip" style="background:#080C14"></div><div class="lbl">base</div><div class="val">#080C14</div></div>
  <div class="swatch"><div class="chip" style="background:#0D1220"></div><div class="lbl">surface</div><div class="val">#0D1220</div></div>
  <div class="swatch"><div class="chip" style="background:#131927"></div><div class="lbl">raised</div><div class="val">#131927</div></div>
  <div class="swatch"><div class="chip" style="background:#161D2E"></div><div class="lbl">panel</div><div class="val">#161D2E</div></div>
  <div class="swatch"><div class="chip" style="background:#1A2235"></div><div class="lbl">panel-hi</div><div class="val">#1A2235</div></div>
  <div class="divider"></div>
  <div class="section-label">BORDER</div>
  <div class="swatch"><div class="chip sm" style="background:#1E2A3F"></div><div class="lbl">dim</div><div class="val">#1E2A3F</div></div>
  <div class="swatch"><div class="chip sm" style="background:#2A3855"></div><div class="lbl">mid</div><div class="val">#2A3855</div></div>
  <div class="swatch"><div class="chip sm" style="background:#3D5070"></div><div class="lbl">bright</div><div class="val">#3D5070</div></div>
</div>
</body></html>
